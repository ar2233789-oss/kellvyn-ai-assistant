name: Poco F6 virtual comparison lab
# Build, exercise, and compare the existing web layout and native Android screen without editing either UI.

on:
  pull_request:
    paths:
      - "android/**"
      - "src/components/kellvyn/**"
      - "src/styles.css"
      - ".github/workflows/poco-f6-parity.yml"
  push:
    branches:
      - main
      - lab/kellvyn-intelligence-core-20261116
    paths:
      - "android/**"
      - "src/components/kellvyn/**"
      - "src/styles.css"
      - "scripts/compare_poco_f6_captures.py"
      - ".github/workflows/poco-f6-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build-and-capture:
    name: Web reference build and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_url: ${{ steps.upload-web.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Run web tests
        run: bun run test
      - name: Build web reference
        run: bun run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture web UI at Poco F6 logical viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/kellvyn-web.log 2>&1 &
          echo $! > /tmp/kellvyn-web.pid
          READY=0
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/kellvyn-web.log; exit 1; fi
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          const page = await browser.newPage({
            // 913dp models the Android app content area after system bars; compare like-for-like.
            viewport: { width: 444, height: 913 },
            deviceScaleFactor: 2.75,
            isMobile: true,
            hasTouch: true,
          });
          const errors = [];
          page.on("pageerror", (error) => errors.push(String(error)));
          await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle", timeout: 60000 });
          await page.screenshot({ path: "out/web-reference.png", fullPage: false });
          const settingsButton = page.getByRole("button", { name: "Configurações" });
          if (await settingsButton.count()) {
            await settingsButton.click();
            await page.waitForTimeout(500);
            await page.screenshot({ path: "out/web-settings.png", fullPage: false });
          } else {
            throw new Error("Lovable reference: settings three-dot button not found");
          }
          const metrics = await page.evaluate(() => {
            const box = (selector) => {
              const element = document.querySelector(selector);
              if (!element) return null;
              const r = element.getBoundingClientRect();
              return { x: r.x, y: r.y, width: r.width, height: r.height };
            };
            const label = (element) =>
              element.getAttribute("aria-label") ||
              element.getAttribute("title") ||
              (element.innerText || "").trim().replace(/\\s+/g, " ").slice(0, 80);
            return {
              title: document.title,
              viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
              header: box("header"),
              main: box("main"),
              composer: box("footer"),
              bottomNav: box("nav"),
              controls: [...document.querySelectorAll("header button, footer button, nav button")].map((e) => ({
                label: label(e),
                rect: (() => { const r = e.getBoundingClientRect(); return { x: r.x, y: r.y, width: r.width, height: r.height }; })(),
              })),
            };
          });
          fs.writeFileSync("out/web-metrics.json", JSON.stringify({ ...metrics, pageErrors: errors }, null, 2));
          console.log(JSON.stringify({ title: metrics.title, controls: metrics.controls.map((c) => c.label), pageErrors: errors }));

          const checks = [];
          const runCheck = async (name, fn) => {
            await fn();
            checks.push({ name, result: "PASS" });
          };
          const heading = (name) => page.getByRole("heading", { name, exact: true });
          const textExact = (value) => page.getByText(value, { exact: true });
          const visible = async (locator, name) => {
            try { await locator.waitFor({ state: "visible", timeout: 6000 }); }
            catch { throw new Error("Expected visible UI element: " + name); }
          };
          const closeSheet = async () => {
            const closers = page.getByRole("button", { name: "Fechar", exact: true });
            if (await closers.count() === 0) throw new Error("Sheet close control is missing");
            await closers.last().click();
          };
          const storageSnapshot = await page.evaluate(() => Object.fromEntries(
            ["kv.settings", "kv.memories", "kellvyn.bots", "kellvyn.snippets"].map((key) => [key, localStorage.getItem(key)])
          ));

          // We opened Settings for the screenshot above. Close it before walking the actual controls.
          await closeSheet();
          await runCheck("header history button opens conversations", async () => {
            await page.getByRole("button", { name: "Histórico de conversas", exact: true }).click();
            await visible(heading("CONVERSAS"), "CONVERSAS");
            await closeSheet();
          });

          await runCheck("plus menu and web-access switch work and restore their state", async () => {
            await page.getByRole("button", { name: "Anexos e Web", exact: true }).click();
            await visible(textExact("Imagem ou arquivo"), "Imagem ou arquivo");
            await visible(textExact("Plugins"), "Plugins");
            const toggle = page.getByRole("checkbox", { name: "Acesso à Web" });
            const before = await toggle.getAttribute("aria-checked");
            if (before !== "true" && before !== "false") throw new Error("Web-access checkbox has no checked state");
            await toggle.click();
            const changed = await toggle.getAttribute("aria-checked");
            if (changed === before) throw new Error("Web-access checkbox did not change state");
            await toggle.click();
            if (await toggle.getAttribute("aria-checked") !== before) throw new Error("Web-access switch did not restore its original state");
            await page.getByRole("button", { name: "Anexos e Web", exact: true }).click();
          });

          await runCheck("browser panel opens and closes", async () => {
            await page.getByRole("button", { name: "Navegador", exact: true }).click();
            await visible(heading("NAVEGADOR"), "NAVEGADOR");
            await visible(page.getByPlaceholder("Pesquise ou digite um site"), "browser address field");
            await closeSheet();
          });

          await runCheck("code editor accepts a save and displays the saved entry", async () => {
            await page.getByRole("button", { name: "Editor", exact: true }).click();
            await visible(heading("EDITOR DE CÓDIGO"), "EDITOR DE CÓDIGO");
            await page.getByPlaceholder("Nome do arquivo").fill("PocoF6-lab.txt");
            await page.getByPlaceholder("Escreva seu código aqui…").fill("layout audit fixture");
            await page.getByRole("button", { name: "Salvar", exact: true }).click();
            await visible(page.getByRole("button", { name: "PocoF6-lab.txt", exact: true }), "saved editor entry");
            await closeSheet();
          });

          await runCheck("terminal action explains its native-only requirement on web", async () => {
            await page.getByRole("button", { name: "Terminal", exact: true }).click();
            await visible(page.getByRole("status").filter({ hasText: "Terminal: requer o app Android nativo" }), "native-only terminal notice");
          });

          await runCheck("bot switches toggle and restore state", async () => {
            await page.getByRole("button", { name: "Bots", exact: true }).click();
            await visible(heading("BOTS ATIVOS"), "BOTS ATIVOS");
            const toggle = page.getByRole("switch", { name: "Bot do Discord" });
            const before = await toggle.getAttribute("aria-checked");
            if (before !== "true" && before !== "false") throw new Error("Discord switch has no checked state");
            await toggle.click();
            if (await toggle.getAttribute("aria-checked") === before) throw new Error("Discord switch did not change state");
            await toggle.click();
            if (await toggle.getAttribute("aria-checked") !== before) throw new Error("Discord switch did not restore its original state");
            await closeSheet();
          });

          await runCheck("phone-apps panel opens", async () => {
            await page.getByRole("button", { name: "Apps", exact: true }).click();
            await visible(heading("APPS DO CELULAR"), "APPS DO CELULAR");
            await visible(textExact("Abrir apps do celular"), "Android apps action");
            await closeSheet();
          });

          await runCheck("all visual-effect controls persist their selection, including rain plus lightning", async () => {
            await page.getByRole("button", { name: "Configurações", exact: true }).click();
            await visible(heading("CONFIGURAÇÕES DO KELLVYN"), "settings sheet");
            for (const section of ["CORES", "EFEITO NA TELA", "ATALHOS", "MODO DE JOGO", "SEGURANÇA"]) {
              await visible(textExact(section), section);
            }
            const effects = async () => page.evaluate(() => JSON.parse(localStorage.getItem("kv.settings") || "{}").effect || ["chuva"]);
            const tapEffect = async (label) => page.getByRole("button", { name: label, exact: true }).click();
            await tapEffect("Chuva");
            if (JSON.stringify(await effects()) !== JSON.stringify(["nenhum"])) throw new Error("Chuva-off selection was not saved");
            await tapEffect("Chuva");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva"])) throw new Error("Chuva-on selection was not saved");
            await tapEffect("Neve");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva", "neve"])) throw new Error("Snow could not run alongside rain");
            await tapEffect("Neve");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva"])) throw new Error("Snow-off state was not saved");
            await tapEffect("Folhas");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva", "folhas"])) throw new Error("Leaves could not run alongside rain");
            await tapEffect("Folhas");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva"])) throw new Error("Leaves-off state was not saved");
            await tapEffect("Raios");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva", "raios"])) throw new Error("Lightning could not run together with rain");
            await tapEffect("Raios");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva"])) throw new Error("Lightning-off state was not saved");
            await tapEffect("Nenhum");
            if (JSON.stringify(await effects()) !== JSON.stringify(["nenhum"])) throw new Error("Nenhum did not disable all visual effects");
            await tapEffect("Chuva");
            if (JSON.stringify(await effects()) !== JSON.stringify(["chuva"])) throw new Error("Rain could not be restored as the default");

            const protection = page.getByRole("switch", { name: "Proteção reforçada" });
            const protectionBefore = await protection.getAttribute("aria-checked");
            if (protectionBefore !== "true" && protectionBefore !== "false") throw new Error("Protection switch has no checked state");
            await protection.click();
            if (await protection.getAttribute("aria-checked") === protectionBefore) throw new Error("Protection switch did not change state");
            await protection.click();
            if (await protection.getAttribute("aria-checked") !== protectionBefore) throw new Error("Protection switch did not restore its original state");
            await page.getByRole("button", { name: "Preto e Dourado", exact: true }).click();
            const palette = await page.evaluate(() => JSON.parse(localStorage.getItem("kv.settings") || "{}"));
            if (palette.color !== "#D4AF37" || palette.bg !== "#0A0907") throw new Error("Palette button did not apply its colors");
            await page.getByRole("button", { name: "Abrir", exact: true }).click();
            await visible(heading("MEMÓRIA LOCAL"), "MEMÓRIA LOCAL");
            await page.getByPlaceholder("Nova informação…").fill("poco-f6-lab-temporary");
            await page.getByRole("button", { name: "Salvar", exact: true }).click();
            const savedMemory = page.getByRole("textbox", { name: "Editar memória" });
            await savedMemory.waitFor({ state: "visible", timeout: 6000 });
            if (await savedMemory.inputValue() !== "poco-f6-lab-temporary") throw new Error("Saved memory text does not match the entered value");
            await closeSheet();
          });

          // Restore all localStorage keys changed by this isolated browser run.
          await page.evaluate((snapshot) => {
            for (const [key, value] of Object.entries(snapshot)) {
              if (value === null) localStorage.removeItem(key);
              else localStorage.setItem(key, value);
            }
          }, storageSnapshot);
          await page.reload({ waitUntil: "networkidle", timeout: 60000 });
          fs.writeFileSync("out/web-interaction-audit.json", JSON.stringify({
            status: "passed",
            checks,
            controls: metrics.controls.map((control) => control.label),
            pageErrors: errors,
          }, null, 2));
          if (errors.length > 0) throw new Error("Web UI raised page errors: " + errors.join("; "));
          console.log(JSON.stringify({ interactionChecks: checks, pageErrors: errors }));
          await browser.close();
          NODE
      - name: Upload web reference capture
        id: upload-web
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-web-reference
          path: out/*
          if-no-files-found: error
          retention-days: 14

  native-emulator-test:
    name: Android emulator boot, launch, and UI capture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_url: ${{ steps.upload-native.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and Poco-like virtual display
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners can be short by ~600 MB for the default Pixel data image.
          # Remove SDKs unused by this Android-only job before creating the virtual device.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          df -h /
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          echo "no" | "$AVDMANAGER" create avd --force --name PocoF6Virtual --package "system-images;android-35;google_apis;x86_64" --device "pixel_7"
          AVD_CONFIG="$ANDROID_AVD_HOME/PocoF6Virtual.avd/config.ini"
          test -f "$AVD_CONFIG"
          # Replace existing AVD properties instead of appending duplicates (the emulator
          # may otherwise keep the default 2 CPU cores). Bound userdata to fit the hosted runner.
          set_avd_prop() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$AVD_CONFIG"; then
              sed -i "s|^$key=.*|$key=$value|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }
          set_avd_prop hw.lcd.width 1220
          set_avd_prop hw.lcd.height 2712
          set_avd_prop hw.lcd.density 440
          # Hosted CI runners cannot reserve the phone's full 8 GB guest RAM in addition
          # to Gradle, the emulator host process and Android system services. Keep this
          # virtual profile focused on display/UI parity; actual Poco F6 performance
          # and 8 GB memory behavior require a physical-device test.
          set_avd_prop hw.ramSize 3072
          set_avd_prop hw.cpu.ncore 2
          set_avd_prop hw.gpu.enabled yes
          set_avd_prop hw.gpu.mode swiftshader_indirect
          set_avd_prop disk.dataPartition.size 4096M
      - name: Compile unit tests and native APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Boot Android 15 virtual display, install APK and capture native UI
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kellvyn-native-debug.apk
          trap 'cp /tmp/poco-f6-emulator.log out/poco-f6-emulator.log 2>/dev/null || true' EXIT
          # GitHub-hosted runner exposes /dev/kvm but may not grant the runner user access.
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd PocoF6Virtual -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > /tmp/poco-f6-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/poco-f6-emulator.pid
          DEVICE_READY=0
          for n in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before ADB became ready."
              cat /tmp/poco-f6-emulator.log || true
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          if [ "$DEVICE_READY" != "1" ]; then
            echo "Timed out waiting 180 seconds for the emulator to appear in ADB."
            adb devices -l || true
            cat /tmp/poco-f6-emulator.log || true
            exit 1
          fi
          BOOTED=0
          for n in $(seq 1 120); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOTED" = "1" ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited during Android boot."
              cat /tmp/poco-f6-emulator.log || true
              exit 1
            fi
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "Timed out waiting 600 seconds for Android boot completion."
            adb devices -l || true
            cat /tmp/poco-f6-emulator.log || true
            exit 1
          fi
          adb shell wm size 1220x2712
          adb shell wm density 440
          # Avoid triggering the stalled Pixel Launcher menu; launch the app directly.
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.kellvyn.assistant/.MainActivity
          sleep 8
          if adb logcat -d -b crash | grep -B 3 -A 12 "Process: com.kellvyn.assistant" > out/native-crashes.txt; then
            cat out/native-crashes.txt
            exit 1
          else
            echo "No crash for com.kellvyn.assistant during startup." > out/native-crashes.txt
          fi
          # The stock emulator launcher may show its own ANR dialog after boot.
          # Dismiss that system dialog and re-check the actual foreground UI; never
          # turn a Kellvyn process crash into a pass.
          UI_READY=0
          for attempt in $(seq 1 12); do
            rm -f out/native-ui.xml
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml out/native-ui.xml >/dev/null 2>&1 || true
            if grep -q 'text="Kellvyn Assistente"' out/native-ui.xml && ! grep -qi "isn't responding" out/native-ui.xml; then
              UI_READY=1
              break
            fi
            if grep -qi "isn't responding" out/native-ui.xml; then
              WAIT_BOUNDS="$(python3 - out/native-ui.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for node in root.iter("node"):
              if node.attrib.get("resource-id") == "android:id/aerr_wait":
                  bounds = node.attrib.get("bounds", "")
                  nums = bounds.replace("][", ",").strip("[]").split(",")
                  if len(nums) == 4 and all(v.isdigit() for v in nums):
                      x1, y1, x2, y2 = map(int, nums)
                      print((x1+x2)//2, (y1+y2)//2)
                  break
          PY
              )"
              if [ -n "$WAIT_BOUNDS" ]; then
                read -r WAIT_X WAIT_Y <<< "$WAIT_BOUNDS"
                adb shell input tap "$WAIT_X" "$WAIT_Y" || true
              else
                adb shell input keyevent 4 || true
              fi
            fi
            sleep 3
          done
          if [ "$UI_READY" != "1" ]; then
            echo "Kellvyn UI was not visible after clearing transient system dialogs."
            cat out/native-ui.xml || true
            exit 1
          fi
          adb shell screencap -p /sdcard/native-screen.png
          adb pull /sdcard/native-screen.png out/native-screen.png >/dev/null
          grep -q "Kellvyn Assistente" out/native-ui.xml
          SETTINGS_TAP="$(python3 - out/native-ui.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for node in root.iter("node"):
              if node.attrib.get("content-desc") == "Configurações":
                  b = node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
                  if len(b) == 4 and all(v.isdigit() for v in b):
                      x1,y1,x2,y2 = map(int,b)
                      print((x1+x2)//2, (y1+y2)//2)
                  break
          PY
          )"
          if [ -z "$SETTINGS_TAP" ]; then
            echo "Could not find the native three-dot settings button in the accessibility tree."
            cat out/native-ui.xml || true
            exit 1
          fi
          read -r SETTINGS_X SETTINGS_Y <<< "$SETTINGS_TAP"
          adb shell input tap "$SETTINGS_X" "$SETTINGS_Y"
          sleep 2
          SETTINGS_READY=0
          for attempt in $(seq 1 8); do
            rm -f out/native-settings-ui.xml
            adb shell uiautomator dump /sdcard/settings-window.xml >/tmp/settings-dump.log 2>&1 || true
            if adb shell ls /sdcard/settings-window.xml >/dev/null 2>&1; then
              adb pull /sdcard/settings-window.xml out/native-settings-ui.xml >/dev/null 2>&1 || true
            fi
            if grep -q "CONFIGURAÇÕES DO KELLVYN" out/native-settings-ui.xml 2>/dev/null; then
              SETTINGS_READY=1
              break
            fi
            sleep 1
          done
          adb shell screencap -p /sdcard/native-settings.png
          adb pull /sdcard/native-settings.png out/native-settings.png >/dev/null
          if [ "$SETTINGS_READY" != "1" ]; then
            echo "The settings sheet did not expose its expected title. Dump output:"
            cat /tmp/settings-dump.log || true
            cat out/native-settings-ui.xml || true
            exit 1
          fi
          # Capture multiple scroll positions before asking UIAutomator to inspect them.
          # UIAutomator can time out after a scroll on this large native settings sheet; screenshots
          # must still be preserved so the visual audit can continue instead of aborting early.
          settings_has_lower_sections() {
            local has_game=0 has_security=0
            for tree in out/native-settings-ui.xml out/native-settings-ui-scroll-*.xml; do
              [ -f "$tree" ] || continue
              if grep -qi "MODO DE JOGO" "$tree"; then has_game=1; fi
              if grep -qi "SEGURANÇA" "$tree"; then has_security=1; fi
            done
            [ "$has_game" -eq 1 ] && [ "$has_security" -eq 1 ]
          }
          for scroll_pass in 1 2 3; do
            if settings_has_lower_sections; then
              break
            fi
            timeout 10s adb shell input swipe 610 2220 610 700 600 || {
              echo "[LAB] swipe failed while scanning settings (pass $scroll_pass)"; exit 1;
            }
            sleep 1
            remote_png="/sdcard/native-settings-scroll-${scroll_pass}.png"
            local_png="out/native-settings-scroll-${scroll_pass}.png"
            if timeout 10s adb exec-out screencap -p >"$local_png" 2>"/tmp/settings-screencap-${scroll_pass}.log" \
                && [ -s "$local_png" ]; then
              cp "$local_png" out/native-settings-scrolled.png
            elif timeout 10s adb shell screencap -p "$remote_png" >"/tmp/settings-screencap-shell-${scroll_pass}.log" 2>&1 \
                && timeout 10s adb pull "$remote_png" "$local_png" >/dev/null 2>&1 \
                && [ -s "$local_png" ]; then
              cp "$local_png" out/native-settings-scrolled.png
            else
              echo "[LAB] warning: settings screenshot failed on both exec-out and shell capture (pass $scroll_pass); continuing with accessibility tree inspection."
              cat "/tmp/settings-screencap-${scroll_pass}.log" 2>/dev/null || true
              cat "/tmp/settings-screencap-shell-${scroll_pass}.log" 2>/dev/null || true
            fi
            remote_xml="/sdcard/settings-window-scrolled-${scroll_pass}.xml"
            local_xml="out/native-settings-ui-scroll-${scroll_pass}.xml"
            if timeout 20s adb shell uiautomator dump "$remote_xml" >/tmp/settings-scrolled-dump.log 2>&1 \
                && timeout 15s adb pull "$remote_xml" "$local_xml" >/dev/null 2>&1; then
              cp "$local_xml" out/native-settings-ui-scrolled.xml
            else
              echo "[LAB] warning: accessibility tree dump failed at settings scroll $scroll_pass; screenshots saved for visual inspection."
              cat /tmp/settings-scrolled-dump.log || true
              # Keep capturing remaining scroll positions; do not discard the diagnostic screenshots.
            fi
          done
          for label in "CONFIGURAÇÕES DO KELLVYN" "CORES" "EFEITO NA TELA" "ATALHOS" "MODO DE JOGO" "SEGURANÇA"; do
            found=0
            for tree in out/native-settings-ui.xml out/native-settings-ui-scroll-*.xml; do
              if [ -f "$tree" ] && grep -qi "$label" "$tree"; then found=1; break; fi
            done
            if [ "$found" -ne 1 ]; then
              case "$label" in
                "MODO DE JOGO"|"SEGURANÇA")
                  if [ -s out/native-settings-scrolled.png ]; then
                    echo "[LAB] visual check required for lower settings category '$label'; scroll screenshots were saved."
                    continue
                  fi
                  ;;
              esac
              echo "Missing settings-sheet section in accessibility tree: $label"
              exit 1
            fi
          done

          # Keep an inventory of all visible native controls at the same point as the web inventory.
          python3 - out/native-ui.xml out/native-controls.json <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          controls = []
          for node in root.iter("node"):
              if node.attrib.get("clickable") == "true" and node.attrib.get("enabled") == "true":
                  controls.append({
                      "label": node.attrib.get("content-desc") or node.attrib.get("text") or "",
                      "text": node.attrib.get("text", ""),
                      "contentDescription": node.attrib.get("content-desc", ""),
                      "bounds": node.attrib.get("bounds", ""),
                      "class": node.attrib.get("class", ""),
                  })
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              json.dump(controls, f, ensure_ascii=False, indent=2)
          print(json.dumps({"nativeClickableControlCount": len(controls), "labels": [c["label"] for c in controls]}, ensure_ascii=False))
          PY

          # UIAutomator helpers: locate a real enabled control by its exact visible or accessibility label.
          dump_current_ui() {
            rm -f out/current-ui.xml
            echo "[LAB] dumping current Android accessibility tree"
            timeout 45s adb shell uiautomator dump --compressed /sdcard/kellvyn-lab-ui.xml >/dev/null 2>&1 || {
              echo "[LAB] compressed UI dump timed out; retrying uncompressed tree"
              timeout 45s adb shell uiautomator dump /sdcard/kellvyn-lab-ui.xml >/dev/null 2>&1 || {
                echo "[LAB] timed out while dumping Android UI tree"; return 1;
              }
            }
            timeout 25s adb pull /sdcard/kellvyn-lab-ui.xml out/current-ui.xml >/dev/null 2>&1 || {
              echo "[LAB] timed out while pulling Android UI tree"; return 1;
            }
            test -s out/current-ui.xml
          }
          tap_control() {
            local mode="$1" value="$2"
            echo "[LAB] tap $mode=$value"
            local point
            point="$(python3 - "$mode" "$value" out/current-ui.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          mode, value, path = sys.argv[1:]
          attr = {"text": "text", "desc": "content-desc"}[mode]
          root = ET.parse(path).getroot()
          expected = value.casefold()
          nodes = [n for n in root.iter("node") if n.attrib.get(attr, "").strip().casefold() == expected
                   and n.attrib.get("clickable") == "true" and n.attrib.get("enabled", "true") == "true"]
          if not nodes:
              print(f"Missing tappable control {mode}={value}", file=sys.stderr)
              sys.exit(2)
          bounds = nodes[0].attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
          if len(bounds) != 4: sys.exit(3)
          x1, y1, x2, y2 = map(int, bounds)
          print((x1+x2)//2, (y1+y2)//2)
          PY
            )" || { echo "Could not locate clickable control: $mode=$value"; cat out/current-ui.xml; exit 1; }
            read -r tx ty <<< "$point"
            timeout 10s adb shell input tap "$tx" "$ty" || { echo "[LAB] timed out while tapping $mode=$value"; exit 1; }
            sleep 1
            dump_current_ui
          }
          tap_text() { tap_control text "$1"; }
          tap_desc() { tap_control desc "$1"; }
          assert_text() {
            echo "[LAB] assert visible text: $1"
            grep -Fqi "text=\"$1\"" out/current-ui.xml || {
              echo "Expected native UI text missing: $1"
              cat out/current-ui.xml
              exit 1
            }
          }
          read_web_pref() {
            adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/native-prefs.xml
            if grep -q 'name="web_access" value="true"' out/native-prefs.xml; then echo true; else echo false; fi
          }
          read_effect_pref() {
            adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/native-prefs.xml
            grep -o 'name="visual_effects">[^<]*' out/native-prefs.xml | sed 's/.*>//'
          }

          # The previous step captured settings and scrolled its content. The Android
          # UIAutomator service can stall after multiple dumps of this tall sheet.
          # Dismiss through the system Back action before requesting a fresh tree.
          adb shell input keyevent 4
          sleep 2
          dump_current_ui
          assert_text "Kellvyn Assistente"

          # History is an item-list dialog without a Close button; dismiss it with Android Back.
          tap_desc "Histórico"
          assert_text "Histórico de conversas"
          adb shell input keyevent 4
          sleep 1
          dump_current_ui
          assert_text "Kellvyn Assistente"

          # The plus menu must expose file selection, plugins and the web-access control.
          tap_desc "Anexos e Web"
          assert_text "Imagem ou arquivo"
          assert_text "Plugins"
          assert_text "Acesso à Web"
          WEB_BEFORE="$(read_web_pref)"
          tap_text "Acesso à Web"
          WEB_AFTER="$(read_web_pref)"
          if [ "$WEB_AFTER" = "$WEB_BEFORE" ]; then echo "Web-access control failed to toggle"; exit 1; fi
          tap_desc "Anexos e Web"
          tap_text "Acesso à Web"
          WEB_RESTORED="$(read_web_pref)"
          if [ "$WEB_RESTORED" != "$WEB_BEFORE" ]; then echo "Web-access control failed to restore its value"; exit 1; fi

          # Check each navigation destination that stays inside Kellvyn; do not open external URLs.
          tap_desc "Navegador"
          assert_text "Abrir Web"
          tap_text "Cancelar"
          tap_desc "Editor"
          assert_text "EDITOR DE CÓDIGO"
          tap_text "Fechar"
          tap_desc "Bots"
          assert_text "BOTS ATIVOS"
          tap_text "Fechar"
          tap_desc "Terminal"
          sleep 1
          adb shell am force-stop com.kellvyn.assistant
          adb shell am start -W -n com.kellvyn.assistant/.MainActivity >/dev/null
          sleep 2
          dump_current_ui
          assert_text "Kellvyn Assistente"

          # Verify the visual effect chooser supports combined rain + lightning, then restore rain-only.
          tap_desc "Configurações"
          if ! grep -q 'text="Raios"' out/current-ui.xml; then
            adb shell input swipe 610 700 610 2220 500
            sleep 1
            dump_current_ui
          fi
          tap_text "Raios"
          EFFECTS_ON="$(read_effect_pref)"
          if [ "$EFFECTS_ON" != '["chuva","raios"]' ]; then
            echo "Expected rain and lightning together, got: $EFFECTS_ON"
            cat out/native-prefs.xml
            exit 1
          fi
          tap_text "Raios"
          EFFECTS_RESTORED="$(read_effect_pref)"
          if [ "$EFFECTS_RESTORED" != '["chuva"]' ]; then
            echo "Expected rain-only to be restored, got: $EFFECTS_RESTORED"
            cat out/native-prefs.xml
            exit 1
          fi
          tap_desc "Fechar configurações"
          sleep 1
          dump_current_ui
          assert_text "Kellvyn Assistente"

          # Exercise the Android HOME action last: it intentionally leaves Kellvyn and invokes the launcher.
          tap_desc "Apps"
          sleep 1
          HOME_ACTIVITY="$(adb shell dumpsys activity activities | grep -m1 -E 'mResumedActivity|topResumedActivity' || true)"
          echo "$HOME_ACTIVITY" > out/native-apps-navigation.txt
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb shell am start -W -n com.kellvyn.assistant/.MainActivity >/dev/null
          sleep 3
          dump_current_ui
          assert_text "Kellvyn Assistente"
          adb shell dumpsys meminfo com.kellvyn.assistant > out/native-meminfo.txt
          adb shell dumpsys activity activities > out/native-activity.txt
          echo "PASS: Android 15 AVD at 1220x2712 / 440 dpi booted, APK installed and launched, UI controls checked, screenshot captured and no startup crash found."
      - name: Run the generated Android app build on the emulator
        working-directory: android
        run: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Install generated APK and test real UI interaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          adb exec-out run-as com.kellvyn.assistant cat files/kellvyn-lab/generated-app.apk > out/generated-app.apk
          test -s out/generated-app.apk
          unzip -t out/generated-app.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/generated-app.apk | grep -F "package: name='com.example.app'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify out/generated-app.apk
          adb install -r out/generated-app.apk
          adb shell am start -W -n com.example.app/.MainActivity
          UI_READY=0
          for attempt in $(seq 1 15); do
            adb shell uiautomator dump /sdcard/kellvyn-generated-app.xml >/dev/null 2>&1 || true
            adb pull /sdcard/kellvyn-generated-app.xml out/generated-app-ui-before.xml >/dev/null 2>&1 || true
            if grep -Fq 'text="APP_BUILD_SMOKE_OK"' out/generated-app-ui-before.xml 2>/dev/null \
                && grep -Fq 'text="Contagem: 0"' out/generated-app-ui-before.xml 2>/dev/null \
                && grep -Fq 'text="Incrementar"' out/generated-app-ui-before.xml 2>/dev/null; then
              UI_READY=1
              break
            fi
            sleep 2
          done
          if [ "$UI_READY" != "1" ]; then
            echo "The generated application did not expose its initial screen and controls."
            cat out/generated-app-ui-before.xml || true
            exit 1
          fi
          TAP_POINT="$(python3 - out/generated-app-ui-before.xml <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for node in root.iter("node"):
              if node.attrib.get("text") == "Incrementar" and node.attrib.get("clickable") == "true":
                  match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      print((x1+x2)//2, (y1+y2)//2)
                      break
          PY
          )"
          if [ -z "$TAP_POINT" ]; then
            echo "Could not locate the generated app's enabled Incrementar button."
            exit 1
          fi
          read -r TAP_X TAP_Y <<< "$TAP_POINT"
          adb shell input tap "$TAP_X" "$TAP_Y"
          sleep 1
          adb shell uiautomator dump /sdcard/kellvyn-generated-app-after.xml >/dev/null 2>&1
          adb pull /sdcard/kellvyn-generated-app-after.xml out/generated-app-ui-after.xml >/dev/null
          grep -Fq 'text="Contagem: 1"' out/generated-app-ui-after.xml || {
            echo "The generated app's button did not update its counter."
            cat out/generated-app-ui-after.xml
            exit 1
          }
          adb shell screencap -p /sdcard/kellvyn-generated-app.png
          adb pull /sdcard/kellvyn-generated-app.png out/generated-app-screen.png >/dev/null
          if adb logcat -d -b crash | grep -B 3 -A 12 -F "Process: com.example.app" > out/generated-app-crashes.txt; then
            cat out/generated-app-crashes.txt
            exit 1
          else
            echo "No generated-app crash recorded during launch and interaction." > out/generated-app-crashes.txt
          fi
          adb shell dumpsys meminfo com.example.app > out/generated-app-meminfo.txt
          echo "PASS: generated Java project passed parser, structural validation, ECJ compilation, D8, APK signing, signature verification, installation, launch, and button interaction."
      - name: Upload native emulator capture and diagnostics
        id: upload-native
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-native-emulator
          path: out/*
          if-no-files-found: warn
          retention-days: 14


  compare-web-and-native-captures:
    name: Pixel-aligned web/native screenshot diff
    needs: [web-build-and-capture, native-emulator-test]
    if: ${{ always() && needs.web-build-and-capture.result == 'success' && needs.native-emulator-test.result == 'success' && needs.web-build-and-capture.outputs.artifact_url != '' && needs.native-emulator-test.outputs.artifact_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download web screenshot captures
        uses: actions/download-artifact@v4
        with:
          name: poco-f6-web-reference
          path: artifacts/web
      - name: Download native emulator captures
        uses: actions/download-artifact@v4
        with:
          name: poco-f6-native-emulator
          path: artifacts/native
      - name: Compare main screen and settings without scaling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy
          mkdir -p out/parity
          python scripts/compare_poco_f6_captures.py --web-dir artifacts/web --native-dir artifacts/native --output-dir out/parity --status-bar-top-px 136
      - name: Upload comparison report, overlays and difference maps
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-visual-comparison
          path: out/parity/*
          if-no-files-found: error
          retention-days: 14
