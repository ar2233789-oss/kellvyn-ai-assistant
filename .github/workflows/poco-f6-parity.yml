            sleep 1
            timeout 10s adb shell dumpsys activity activities > out/native-after-history.txt
            if ! grep -E 'mResumedActivity|topResumedActivity' out/native-after-history.txt | grep -Fq 'com.kellvyn.assistant/.MainActivity'; then
              echo "Kellvyn did not return to the foreground after dismissing the history result."
              cat out/native-after-history.txt
              exit 1
            fi
            if dump_current_ui; then
              assert_text "Kellvyn Assistente"
            else
              cp out/native-ui.xml out/current-ui.xml
              assert_text "Kellvyn Assistente"
            fi
          fi

          # The plus menu must expose file selection, plugins and the web-access control.
          tap_desc "Anexos e Web"
          assert_text "Imagem ou arquivo"
          assert_text "Plugins"
          assert_text "Acesso à Web"
          WEB_BEFORE="$(read_web_pref)"
          tap_text "Acesso à Web"
          WEB_AFTER="$(read_web_pref)"
          if [ "$WEB_AFTER" = "$WEB_BEFORE" ]; then echo "Web-access control failed to toggle"; exit 1; fi
          tap_desc "Anexos e Web"
          tap_text "Acesso à Web"
          WEB_RESTORED="$(read_web_pref)"
          if [ "$WEB_RESTORED" != "$WEB_BEFORE" ]; then echo "Web-access control failed to restore its value"; exit 1; fi

          # Check each navigation destination that stays inside Kellvyn; do not open external URLs.
          tap_desc "Navegador"
          assert_text "Abrir Web"
          tap_android_dialog_button "android:id/button2"
          tap_desc "Editor"
          assert_text "EDITOR DE CÓDIGO"
          tap_android_dialog_button "android:id/button2"
          tap_desc "Bots"
          assert_text "BOTS ATIVOS"
          tap_android_dialog_button "android:id/button1"
          tap_desc "Terminal"
          sleep 1
          timeout 10s adb shell am force-stop com.kellvyn.assistant
          timeout 30s adb shell am start -W -n com.kellvyn.assistant/.MainActivity >/dev/null
          sleep 2
          dump_current_ui
          assert_text "Kellvyn Assistente"

          # Verify the visual effect chooser supports combined rain + lightning, then restore rain-only.
          if [ "$SETTINGS_ACCESSIBILITY" = "1" ]; then
            tap_desc "Configurações"
            if ! grep -q 'text="Raios"' out/current-ui.xml; then
              timeout 10s adb shell input swipe 610 700 610 2220 500
              sleep 1
              dump_current_ui
            fi
            tap_text "Raios"
            EFFECTS_ON="$(read_effect_pref)"
            if [ "$EFFECTS_ON" != '["chuva","raios"]' ]; then
              echo "Expected rain and lightning together, got: $EFFECTS_ON"
              cat out/native-prefs.xml
              exit 1
            fi
            tap_text "Raios"
            EFFECTS_RESTORED="$(read_effect_pref)"
            if [ "$EFFECTS_RESTORED" != '["chuva"]' ]; then
              echo "Expected rain-only to be restored, got: $EFFECTS_RESTORED"
              cat out/native-prefs.xml
              exit 1
            fi
            tap_desc "Fechar configurações"
            sleep 1
            dump_current_ui
            assert_text "Kellvyn Assistente"
          else
            # Coordinate fallback because UIAutomator does not expose the custom settings dialog.
            timeout 10s adb shell input tap 1135 200
            sleep 2
            timeout 10s adb shell screencap -p /sdcard/native-settings-effects.png
            timeout 10s adb pull /sdcard/native-settings-effects.png out/native-settings-effects.png >/dev/null
            timeout 10s adb shell input tap 660 2130
            sleep 1
            EFFECTS_ON="$(read_effect_pref)"
            if [ "$EFFECTS_ON" != '["chuva","raios"]' ]; then
              echo "Coordinate tap did not enable combined rain and lightning: $EFFECTS_ON"
              cat out/native-prefs.xml
              exit 1
            fi
            # Close the settings sheet with its fixed header X and record the real native lightning.
            # The short capture makes the actual bolt shape/fade inspectable instead of guessing from code.
            timeout 10s adb shell input tap 1135 570
            sleep 1
            timeout 25s adb shell screenrecord --bit-rate 3000000 --time-limit 10 /sdcard/native-lightning.mp4
            timeout 20s adb pull /sdcard/native-lightning.mp4 out/native-lightning.mp4 >/dev/null
            timeout 10s adb shell screencap -p /sdcard/native-lightning-final.png
            timeout 10s adb pull /sdcard/native-lightning-final.png out/native-lightning-final.png >/dev/null
            # Reopen settings and turn lightning off after the recording.
            timeout 10s adb shell input tap 1135 200
            sleep 2
            timeout 10s adb shell input tap 660 2130
            sleep 1
            EFFECTS_RESTORED="$(read_effect_pref)"
            if [ "$EFFECTS_RESTORED" != '["chuva"]' ]; then
              echo "Coordinate tap did not restore rain-only: $EFFECTS_RESTORED"
              cat out/native-prefs.xml
              exit 1
            fi
            # Use the visible X in the settings header; outside taps can hit a color card on this full-height AVD.
            timeout 10s adb shell input tap 1135 570
            sleep 1
            timeout 10s adb shell dumpsys activity activities > out/native-after-effects-close.txt
            if ! grep -E 'mResumedActivity|topResumedActivity' out/native-after-effects-close.txt | grep -Fq 'com.kellvyn.assistant/.MainActivity'; then
              echo "Kellvyn did not return to the foreground after the effects chooser test."
              cat out/native-after-effects-close.txt
              exit 1
            fi
            if dump_current_ui; then
              assert_text "Kellvyn Assistente"
            else
              cp out/native-ui.xml out/current-ui.xml
              assert_text "Kellvyn Assistente"
              echo "Main-screen controls will continue from the startup accessibility tree after the coordinate settings test." > out/native-main-accessibility-warning.txt
            fi
          fi

          # Exercise the Android HOME action last: it intentionally leaves Kellvyn and invokes the launcher.
          tap_desc "Apps"
          sleep 1
          HOME_ACTIVITY="$(timeout 10s adb shell dumpsys activity activities | grep -m1 -E 'mResumedActivity|topResumedActivity' || true)"
          echo "$HOME_ACTIVITY" > out/native-apps-navigation.txt
          timeout 10s adb shell am force-stop com.google.android.apps.nexuslauncher || true
          timeout 20s adb shell am start -W -n com.kellvyn.assistant/.MainActivity >/dev/null
          sleep 3
          # UIAutomator can hang after the launcher hand-off on the Android 15 AVD.
          # We already exercised the app controls above; verify the return with the
          # resumed-activity record and a fresh screenshot instead of another UIA dump.
          timeout 10s adb shell dumpsys activity activities > out/native-activity.txt
          if ! grep -E 'mResumedActivity|topResumedActivity' out/native-activity.txt | grep -q 'com\.kellvyn\.assistant/.MainActivity'; then
            echo "Kellvyn did not return to the foreground after the Apps launcher test."
            grep -E 'mResumedActivity|topResumedActivity' out/native-activity.txt || true
            exit 1
          fi
          timeout 15s adb shell screencap -p /sdcard/native-screen-after-home.png
          timeout 15s adb pull /sdcard/native-screen-after-home.png out/native-screen-after-home.png >/dev/null

          # Render a deterministic saved exchange without invoking or modifying the AI core.
          # This directly exercises the four response controls that were reported as broken.
          timeout 10s adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/native-prefs-before-response-controls.xml
          python3 - out/native-prefs-before-response-controls.xml out/native-prefs-response-controls.xml <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          source, destination = sys.argv[1:]
          tree = ET.parse(source)
          root = tree.getroot()
          payload = json.dumps([
              "U|Pergunta sintética do laboratório",
              "S|Resposta sintética para verificar os botões"
          ], ensure_ascii=False, separators=(",", ":"))
          node = next((n for n in root if n.tag == "string" and n.attrib.get("name") == "transcript"), None)
          if node is None:
              node = ET.SubElement(root, "string", {"name": "transcript"})
          node.text = payload
          tree.write(destination, encoding="utf-8", xml_declaration=True)
          PY
          timeout 10s adb push out/native-prefs-response-controls.xml /sdcard/kellvyn-response-controls.xml >/dev/null
          timeout 10s adb shell run-as com.kellvyn.assistant cp /sdcard/kellvyn-response-controls.xml shared_prefs/kellvyn_native.xml
          timeout 10s adb shell am force-stop com.kellvyn.assistant
          timeout 20s adb shell am start -W -n com.kellvyn.assistant/.MainActivity >/dev/null
          sleep 3
          dump_current_ui
          assert_text "Kellvyn Assistente"
          assert_text "Resposta sintética para verificar os botões"
          python3 - out/current-ui.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          wanted = ("Copiar", "Ouvir", "Baixar", "Compartilhar")
          found = {}
          answer_bottom = None
          for node in root.iter("node"):
              if node.attrib.get("text") == "Resposta sintética para verificar os botões":
                  bounds = [int(v) for v in node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")]
                  if len(bounds) == 4:
                      answer_bottom = bounds[3]
              desc = node.attrib.get("content-desc", "")
              if desc in wanted and node.attrib.get("clickable") == "true" and node.attrib.get("enabled", "true") == "true":
                  bounds = [int(v) for v in node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")]
                  if len(bounds) == 4:
                      found[desc] = bounds
          missing = [label for label in wanted if label not in found]
          if missing:
              raise SystemExit("Response action controls missing or not tappable: " + ", ".join(missing))
          if answer_bottom is not None and min(b[1] for b in found.values()) < answer_bottom:
              raise SystemExit("Response action buttons are not positioned below the assistant message.")
          ys = [b[1] for b in found.values()]
          if max(ys) - min(ys) > 8:
              raise SystemExit("Response action buttons are not aligned on the same row: " + repr(found))
          print("PASS: four enabled response controls are present and aligned below the assistant message: " + repr(found))
          PY
          timeout 10s adb shell screencap -p /sdcard/native-response-controls.png
          timeout 10s adb pull /sdcard/native-response-controls.png out/native-response-controls.png >/dev/null

          # Exercise each action. System pickers/choosers are dismissed with Back before continuing.
          tap_desc "Copiar"
          assert_text "Resposta sintética para verificar os botões"
          tap_desc "Ouvir"
          assert_text "Resposta sintética para verificar os botões"
          tap_desc "Baixar"
          timeout 10s adb shell input keyevent 4
          sleep 1
          dump_current_ui
          assert_text "Kellvyn Assistente"
          tap_desc "Compartilhar"
          timeout 10s adb shell input keyevent 4
          sleep 1
          dump_current_ui
          assert_text "Kellvyn Assistente"
          assert_text "Resposta sintética para verificar os botões"
          timeout 10s adb shell dumpsys activity activities > out/native-after-response-controls.txt
          if ! grep -E 'mResumedActivity|topResumedActivity' out/native-after-response-controls.txt | grep -Fq 'com.kellvyn.assistant/.MainActivity'; then
            echo "Kellvyn did not remain in the foreground after exercising response controls."
            exit 1
          fi
          timeout 15s adb shell dumpsys meminfo com.kellvyn.assistant > out/native-meminfo.txt
          echo "PASS: Android 15 AVD booted, app controls checked, color palette round-trip validated, four response controls exercised, UI captured and no startup crash."
      - name: Upload native emulator capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-native-emulator
          path: out/*
          if-no-files-found: warn
          retention-days: 14


  compare-web-and-native-captures:
    name: Pixel-aligned web/native screenshot diff
    needs: [web-build-and-capture, native-emulator-test]
    if: ${{ always() && needs.web-build-and-capture.result == 'success' && needs.native-emulator-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download web screenshot captures
        uses: actions/download-artifact@v4
        with:
          name: poco-f6-web-reference
          path: artifacts/web
      - name: Download native emulator captures
        uses: actions/download-artifact@v4
        with:
          name: poco-f6-native-emulator
          path: artifacts/native
      - name: Validate the lab's own screenshot comparator
        timeout-minutes: 3
        run: python scripts/test_compare_poco_f6_captures.py
      - name: Compare main screen, settings and palette change without scaling
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow numpy
          mkdir -p out/parity
          python scripts/compare_poco_f6_captures.py --web-dir artifacts/web --native-dir artifacts/native --output-dir out/parity --status-bar-top-px 136
      - name: Upload comparison report, overlays and difference maps
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-visual-comparison
          path: out/parity/*
          if-no-files-found: error
          retention-days: 14
