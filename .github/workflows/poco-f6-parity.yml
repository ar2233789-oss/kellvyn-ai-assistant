name: Poco F6 virtual comparison lab
# Capture the restored native baseline and validate only the three-dot settings action.

on:
  pull_request:
    paths:
      - "android/**"
      - "src/components/kellvyn/**"
      - "src/styles.css"
      - ".github/workflows/poco-f6-parity.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/poco-f6-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build-and-capture:
    name: Web reference build and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Run web tests
        run: bun run test
      - name: Build web reference
        run: bun run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture web UI at Poco F6 logical viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/kellvyn-web.log 2>&1 &
          echo $! > /tmp/kellvyn-web.pid
          READY=0
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/kellvyn-web.log; exit 1; fi
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          const page = await browser.newPage({
            // 913dp models the Android app content area after system bars; compare like-for-like.
            viewport: { width: 444, height: 913 },
            deviceScaleFactor: 2.75,
            isMobile: true,
            hasTouch: true,
          });
          const errors = [];
          page.on("pageerror", (error) => errors.push(String(error)));
          await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle", timeout: 60000 });
          await page.screenshot({ path: "out/web-reference.png", fullPage: false });
          const settingsButton = page.getByRole("button", { name: "Configurações" });
          if (await settingsButton.count()) {
            await settingsButton.click();
            await page.waitForTimeout(500);
            await page.screenshot({ path: "out/web-settings.png", fullPage: false });
          } else {
            throw new Error("Lovable reference: settings three-dot button not found");
          }
          const metrics = await page.evaluate(() => {
            const box = (selector) => {
              const element = document.querySelector(selector);
              if (!element) return null;
              const r = element.getBoundingClientRect();
              return { x: r.x, y: r.y, width: r.width, height: r.height };
            };
            const label = (element) =>
              element.getAttribute("aria-label") ||
              element.getAttribute("title") ||
              (element.innerText || "").trim().replace(/\\s+/g, " ").slice(0, 80);
            return {
              title: document.title,
              viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio },
              header: box("header"),
              main: box("main"),
              composer: box("footer"),
              bottomNav: box("nav"),
              controls: [...document.querySelectorAll("header button, footer button, nav button")].map((e) => ({
                label: label(e),
                rect: (() => { const r = e.getBoundingClientRect(); return { x: r.x, y: r.y, width: r.width, height: r.height }; })(),
              })),
            };
          });
          fs.writeFileSync("out/web-metrics.json", JSON.stringify({ ...metrics, pageErrors: errors }, null, 2));
          console.log(JSON.stringify({ title: metrics.title, controls: metrics.controls.map((c) => c.label), pageErrors: errors }));
          await browser.close();
          NODE
      - name: Upload web reference capture
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-web-reference
          path: out/*
          if-no-files-found: error
          retention-days: 14

  native-emulator-test:
    name: Android emulator boot, launch, and UI capture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and Poco-like virtual display
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners can be short by ~600 MB for the default Pixel data image.
          # Remove SDKs unused by this Android-only job before creating the virtual device.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          df -h /
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          echo "no" | "$AVDMANAGER" create avd --force --name PocoF6Virtual --package "system-images;android-35;google_apis;x86_64" --device "pixel_7"
          AVD_CONFIG="$ANDROID_AVD_HOME/PocoF6Virtual.avd/config.ini"
          test -f "$AVD_CONFIG"
          # Replace existing AVD properties instead of appending duplicates (the emulator
          # may otherwise keep the default 2 CPU cores). Bound userdata to fit the hosted runner.
          set_avd_prop() {
            local key="$1" value="$2"
            if grep -q "^$key=" "$AVD_CONFIG"; then
              sed -i "s|^$key=.*|$key=$value|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }
          set_avd_prop hw.lcd.width 1220
          set_avd_prop hw.lcd.height 2712
          set_avd_prop hw.lcd.density 440
          set_avd_prop hw.ramSize 8192
          set_avd_prop hw.cpu.ncore 4
          set_avd_prop hw.gpu.enabled yes
          set_avd_prop hw.gpu.mode swiftshader_indirect
          set_avd_prop disk.dataPartition.size 4096M
      - name: Compile unit tests and native APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Boot Android 15 virtual display, install APK and capture native UI
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p out
          trap 'cp /tmp/poco-f6-emulator.log out/poco-f6-emulator.log 2>/dev/null || true' EXIT
          # GitHub-hosted runner exposes /dev/kvm but may not grant the runner user access.
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd PocoF6Virtual -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > /tmp/poco-f6-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/poco-f6-emulator.pid
          DEVICE_READY=0
          for n in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before ADB became ready."
              cat /tmp/poco-f6-emulator.log || true
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          if [ "$DEVICE_READY" != "1" ]; then
            echo "Timed out waiting 180 seconds for the emulator to appear in ADB."
            adb devices -l || true
            cat /tmp/poco-f6-emulator.log || true
            exit 1
          fi
          BOOTED=0
          for n in $(seq 1 120); do
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOTED" = "1" ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited during Android boot."
              cat /tmp/poco-f6-emulator.log || true
              exit 1
            fi
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "Timed out waiting 600 seconds for Android boot completion."
            adb devices -l || true
            cat /tmp/poco-f6-emulator.log || true
            exit 1
          fi
          adb shell wm size 1220x2712
          adb shell wm density 440
          # Avoid triggering the stalled Pixel Launcher menu; launch the app directly.
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.kellvyn.assistant/.MainActivity
          sleep 8
          if adb logcat -d -b crash | grep -B 3 -A 12 "Process: com.kellvyn.assistant" > out/native-crashes.txt; then
            cat out/native-crashes.txt
            exit 1
          else
            echo "No crash for com.kellvyn.assistant during startup." > out/native-crashes.txt
          fi
          # The stock emulator launcher may show its own ANR dialog after boot.
          # Dismiss that system dialog and re-check the actual foreground UI; never
          # turn a Kellvyn process crash into a pass.
          UI_READY=0
          for attempt in $(seq 1 12); do
            rm -f out/native-ui.xml
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml out/native-ui.xml >/dev/null 2>&1 || true
            if grep -q 'text="Kellvyn Assistente"' out/native-ui.xml && ! grep -qi "isn't responding" out/native-ui.xml; then
              UI_READY=1
              break
            fi
            if grep -qi "isn't responding" out/native-ui.xml; then
              WAIT_BOUNDS="$(python3 - out/native-ui.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for node in root.iter("node"):
              if node.attrib.get("resource-id") == "android:id/aerr_wait":
                  bounds = node.attrib.get("bounds", "")
                  nums = bounds.replace("][", ",").strip("[]").split(",")
                  if len(nums) == 4 and all(v.isdigit() for v in nums):
                      x1, y1, x2, y2 = map(int, nums)
                      print((x1+x2)//2, (y1+y2)//2)
                  break
          PY
              )"
              if [ -n "$WAIT_BOUNDS" ]; then
                read -r WAIT_X WAIT_Y <<< "$WAIT_BOUNDS"
                adb shell input tap "$WAIT_X" "$WAIT_Y" || true
              else
                adb shell input keyevent 4 || true
              fi
            fi
            sleep 3
          done
          if [ "$UI_READY" != "1" ]; then
            echo "Kellvyn UI was not visible after clearing transient system dialogs."
            cat out/native-ui.xml || true
            exit 1
          fi
          adb shell screencap -p /sdcard/native-screen.png
          adb pull /sdcard/native-screen.png out/native-screen.png >/dev/null
          grep -q "Kellvyn Assistente" out/native-ui.xml
          SETTINGS_TAP="$(python3 - out/native-ui.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for node in root.iter("node"):
              if node.attrib.get("content-desc") == "Configurações":
                  b = node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
                  if len(b) == 4 and all(v.isdigit() for v in b):
                      x1,y1,x2,y2 = map(int,b)
                      print((x1+x2)//2, (y1+y2)//2)
                  break
          PY
          )"
          if [ -z "$SETTINGS_TAP" ]; then
            echo "Could not find the native three-dot settings button in the accessibility tree."
            cat out/native-ui.xml || true
            exit 1
          fi
          read -r SETTINGS_X SETTINGS_Y <<< "$SETTINGS_TAP"
          adb shell input tap "$SETTINGS_X" "$SETTINGS_Y"
          sleep 2
          SETTINGS_READY=0
          for attempt in $(seq 1 8); do
            rm -f out/native-settings-ui.xml
            adb shell uiautomator dump /sdcard/settings-window.xml >/tmp/settings-dump.log 2>&1 || true
            if adb shell ls /sdcard/settings-window.xml >/dev/null 2>&1; then
              adb pull /sdcard/settings-window.xml out/native-settings-ui.xml >/dev/null 2>&1 || true
            fi
            if grep -q "CONFIGURAÇÕES DO KELLVYN" out/native-settings-ui.xml 2>/dev/null; then
              SETTINGS_READY=1
              break
            fi
            sleep 1
          done
          adb shell screencap -p /sdcard/native-settings.png
          adb pull /sdcard/native-settings.png out/native-settings.png >/dev/null
          if [ "$SETTINGS_READY" != "1" ]; then
            echo "The settings sheet did not expose its expected title. Dump output:"
            cat /tmp/settings-dump.log || true
            cat out/native-settings-ui.xml || true
            exit 1
          fi
          # Verify the isolated three-dot panel, then exercise the existing main-screen routes.
          dump_current_ui() {
            adb shell uiautomator dump /sdcard/kell-current.xml >/dev/null 2>&1 || true
            adb pull /sdcard/kell-current.xml out/current-ui.xml >/dev/null 2>&1 || true
            test -s out/current-ui.xml
          }
          tap_node() {
            local mode="$1" value="$2" occurrence="$3"
            if [ -z "$occurrence" ]; then occurrence=0; fi
            local point
            point="$(python3 - "$mode" "$value" "$occurrence" out/current-ui.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          mode, value, occurrence, path = sys.argv[1:]
          attr = {"text":"text", "desc":"content-desc", "class":"class"}[mode]
          root = ET.parse(path).getroot()
          def matches(n):
              actual = n.attrib.get(attr, "")
              expected = value
              if mode == "text":
                  actual = actual.casefold()
                  expected = expected.casefold()
              return actual == expected and n.attrib.get("clickable") == "true" and n.attrib.get("enabled") == "true"
          nodes = [n for n in root.iter("node") if matches(n)]
          if not nodes: sys.exit(2)
          i = int(occurrence)
          if i < 0: i += len(nodes)
          if i < 0 or i >= len(nodes): sys.exit(3)
          b = nodes[i].attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
          if len(b) != 4: sys.exit(4)
          x1,y1,x2,y2 = map(int,b)
          print((x1+x2)//2, (y1+y2)//2)
          PY
          )" || { echo "Missing tappable node: $mode=$value"; cat out/current-ui.xml; exit 1; }
            read -r tx ty <<< "$point"
            adb shell input tap "$tx" "$ty"
            sleep 1
            dump_current_ui
          }
          tap_parent_of_text() {
            local value="$1"
            local point
            point="$(python3 - "$value" out/current-ui.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          value, path = sys.argv[1:]
          root = ET.parse(path).getroot()
          parents = {child: parent for parent in root.iter() for child in parent}
          for target in root.iter("node"):
              if target.attrib.get("text", "") != value: continue
              node = parents.get(target)
              while node is not None:
                  if node.tag == "node" and node.attrib.get("clickable") == "true" and node.attrib.get("enabled") == "true":
                      b = node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
                      if len(b) == 4:
                          x1,y1,x2,y2 = map(int,b)
                          print((x1+x2)//2, (y1+y2)//2)
                          sys.exit(0)
                  node = parents.get(node)
          sys.exit(2)
          PY
          )" || { echo "Missing clickable parent for text: $value"; cat out/current-ui.xml; exit 1; }
            read -r tx ty <<< "$point"
            adb shell input tap "$tx" "$ty"
            sleep 1
            dump_current_ui
          }
          assert_ui() {
            grep -Fqi "$1" out/current-ui.xml || { echo "Expected UI text not found: $1"; cat out/current-ui.xml; exit 1; }
          }
          tap_text() { tap_node text "$1" "$2"; }
          tap_desc() { tap_node desc "$1" "$2"; }

          dump_current_ui
          # Full settings sheet from the previously downloaded build. The panel is scrollable.
          for label in "CONFIGURAÇÕES DO KELLVYN" "Cores" "Destaque" "Fundo" "Texto" "Intensidade do brilho" "Temas prontos" "Esmeralda" "Preto e Dourado" "Efeito na tela" "Chuva" "Raios"; do
            assert_ui "$label"
          done

          # Custom color edit can be opened and cancelled without closing the settings sheet.
          tap_parent_of_text "Destaque"
          assert_ui "Informe uma cor HEX de seis dígitos"
          tap_text "Cancelar" 0
          assert_ui "CONFIGURAÇÕES DO KELLVYN"

          # Test a preset theme and restore the original Emerald palette immediately.
          tap_parent_of_text "Preto e Dourado"
          assert_ui "CONFIGURAÇÕES DO KELLVYN"
          tap_parent_of_text "Esmeralda"
          assert_ui "CONFIGURAÇÕES DO KELLVYN"
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-theme-restored.xml
          grep -q 'name="accent" value="9533116"' out/prefs-theme-restored.xml || {
            echo "Emerald accent was not restored after the palette interaction."
            cat out/prefs-theme-restored.xml
            exit 1
          }

          # Confirm that rain and lightning can be enabled together, then restore rain-only default.
          tap_text "Raios" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-both-effects.xml
          grep -q "chuva" out/prefs-both-effects.xml && grep -q "raios" out/prefs-both-effects.xml || {
            echo "Rain and lightning were not stored together."
            cat out/prefs-both-effects.xml
            exit 1
          }
          tap_text "Raios" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-rain-restored.xml
          grep -q "chuva" out/prefs-rain-restored.xml || { echo "Rain effect was lost while restoring defaults."; exit 1; }
          if grep -q "raios" out/prefs-rain-restored.xml; then
            echo "Lightning remained active after restoring rain-only default."
            cat out/prefs-rain-restored.xml
            exit 1
          fi

          # Scroll to settings sections lower than the initial viewport.
          adb shell input swipe 610 2200 610 700 600
          sleep 1
          dump_current_ui
          for label in "Atalhos" "Memória local" "Assistente virtual" "Leitura de tela" "Modo de jogo" "Segurança" "Proteção reforçada da IA" "Fechar"; do
            assert_ui "$label"
          done

          # Security preference toggle must work and be restored to the original ON value.
          tap_node class "android.widget.Switch" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-protection-off.xml
          grep -q 'name="protection" value="false"' out/prefs-protection-off.xml || {
            echo "Security switch did not turn protection off."
            cat out/prefs-protection-off.xml
            exit 1
          }
          tap_node class "android.widget.Switch" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-protection-restored.xml
          grep -q 'name="protection" value="true"' out/prefs-protection-restored.xml || {
            echo "Security switch did not restore protection."
            cat out/prefs-protection-restored.xml
            exit 1
          }

          # Local memory row opens, saves a harmless lab-only test value and closes cleanly.
          tap_parent_of_text "Memória local"
          assert_ui "MEMÓRIA LOCAL"
          assert_ui "Nova informação"
          tap_node class "android.widget.EditText" 0
          adb shell input text "lab_memoria_funcionou"
          dump_current_ui
          tap_text "Salvar" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-local-memory.xml
          grep -q "lab_memoria_funcionou" out/prefs-local-memory.xml || {
            echo "Local memory did not persist its test value."
            cat out/prefs-local-memory.xml
            exit 1
          }
          tap_text "Fechar" 0
          assert_ui "Kellvyn Assistente"

          # Existing Bot, Editor, Browser and History views are unchanged and remain reachable.
          tap_desc "Bots" 0
          assert_ui "BOTS ATIVOS"
          assert_ui "Telegram"
          assert_ui "Discord"
          assert_ui "WhatsApp"
          assert_ui "webhook público"
          tap_text "Fechar" 0
          assert_ui "Kellvyn Assistente"

          tap_desc "Editor" 0
          assert_ui "EDITOR DE CÓDIGO"
          assert_ui "Arquivos salvos"
          tap_text "Fechar" 0
          assert_ui "Kellvyn Assistente"

          tap_desc "Navegador" 0
          assert_ui "Abrir Web"
          assert_ui "https://"
          tap_text "Cancelar" 0
          assert_ui "Kellvyn Assistente"

          tap_desc "Histórico" 0
          assert_ui "Histórico de conversas"
          assert_ui "Conversa atual"
          assert_ui "Nova conversa"
          tap_text "Fechar" 0
          assert_ui "Kellvyn Assistente"

          # Plus menu: test Web access toggle both ways, Plugins and system file picker.
          tap_desc "Anexos e Web" 0
          assert_ui "Imagem ou arquivo"
          assert_ui "Plugins"
          assert_ui "Acesso à Web"
          tap_text "Acesso à Web" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-web-on.xml
          grep -q 'name="web_access" value="true"' out/prefs-web-on.xml || {
            echo "Web-access item did not enable the preference."
            cat out/prefs-web-on.xml
            exit 1
          }
          tap_desc "Anexos e Web" 0
          tap_text "Acesso à Web" 0
          adb shell run-as com.kellvyn.assistant cat shared_prefs/kellvyn_native.xml > out/prefs-web-restored.xml
          grep -q 'name="web_access" value="false"' out/prefs-web-restored.xml || {
            echo "Web-access item did not restore the preference to OFF."
            cat out/prefs-web-restored.xml
            exit 1
          }

          tap_desc "Anexos e Web" 0
          tap_text "Plugins" 0
          assert_ui "PLUGINS"
          tap_text "Fechar" 0
          assert_ui "Kellvyn Assistente"
          tap_desc "Anexos e Web" 0
          tap_text "Imagem ou arquivo" 0
          sleep 2
          adb shell dumpsys activity activities > out/file-picker-activity.txt
          if adb shell pm list packages | grep -q 'documentsui'; then
            grep -qi "documentsui" out/file-picker-activity.txt || { echo "Document picker was not brought to foreground"; cat out/file-picker-activity.txt; exit 1; }
          fi
          adb shell input keyevent 4
          sleep 1
          dump_current_ui
          assert_ui "Kellvyn Assistente"

          # Terminal handoff must leave the chat intact when Termux is absent in the test AVD.
          if ! adb shell pm list packages | grep -q 'com.termux'; then
            tap_desc "Terminal" 0
            assert_ui "Kellvyn Assistente"
          else
            echo "Termux exists in the runner; external terminal left unopened."
          fi

          # Chat submission is verified to reach the local-model download gate. Do not download the model.
          tap_node class "android.widget.EditText" 0
          adb shell input text "ola"
          dump_current_ui
          tap_desc "Enviar mensagem" 0
          assert_ui "Preparar o cérebro local"
          assert_ui "Baixar e enviar"
          tap_text "Agora não" 0
          assert_ui "Kellvyn Assistente"

          # Voice entry should launch speech recognition when available and never crash the app.
          tap_desc "Ditado por voz" 0
          sleep 2
          adb shell dumpsys activity activities > out/speech-activity.txt
          if ! grep -q "com.kellvyn.assistant/.MainActivity" out/speech-activity.txt; then
            adb shell input keyevent 4
            sleep 1
          fi
          dump_current_ui
          assert_ui "Kellvyn Assistente"

          # Apps shortcut intentionally opens the Android launcher; check handoff, then end UI interaction.
          tap_desc "Apps" 0
          sleep 2
          adb shell dumpsys activity activities > out/apps-activity.txt
          if grep -E "mResumedActivity|topResumedActivity" out/apps-activity.txt | grep -q "com.kellvyn.assistant"; then
            echo "Apps shortcut did not leave Kellvyn for the Android launcher."
            cat out/apps-activity.txt
            exit 1
          fi

          adb shell dumpsys meminfo com.kellvyn.assistant > out/native-meminfo.txt
          adb shell dumpsys activity activities > out/native-activity.txt
          echo "PASS: Android 15 AVD at 1220x2712 / 440 dpi booted, APK installed and launched, UI controls checked, screenshot captured and no startup crash found."
      - name: Upload native emulator capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poco-f6-native-emulator
          path: out/*
          if-no-files-found: warn
          retention-days: 14
