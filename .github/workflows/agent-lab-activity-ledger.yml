name: Kellvyn Agent Lab — activity ledger

on:
  push:
    branches:
      - lab/kellvyn-intelligence-core-20261116
    paths-ignore:
      - docs/kellvyn/DEVELOPMENT_ACTIVITY.md
      - .github/workflows/agent-lab-activity-ledger.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kellvyn-agent-lab-activity-ledger
  cancel-in-progress: false

jobs:
  append-activity:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Checkout the pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Append commit metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/append-agent-lab-activity.py

      - name: Publish the activity ledger
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/kellvyn/DEVELOPMENT_ACTIVITY.md; then
            echo "No activity update required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kellvyn/DEVELOPMENT_ACTIVITY.md
          git commit -m "docs(kellvyn): automatic activity ledger [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
