name: Kellvyn agent laboratory tests

on:
  workflow_dispatch:
  push:
    branches:
      - lab/kellvyn-intelligence-core-20261116
      - 'kellvyn-rnd/**'
    paths:
      - 'android/app/src/main/java/com/kellvyn/assistant/Kellvyn*.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/neural/**'
      - 'android/app/src/main/java/com/kellvyn/assistant/workspace/**'
      - 'android/app/src/androidTest/**'
      - 'android/app/src/test/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/xml/**'
      - 'android/app/build.gradle'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle.properties'
      - '.github/workflows/agent-lab-tests.yml'
      - 'tools/kellvyn-rnd-studio/**'
      - 'docs/kellvyn/rnd-studio/**'

permissions:
  contents: read

concurrency:
  group: kellvyn-agent-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-allocation-probe:
    name: Minimal runner allocation probe (ubuntu-slim)
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner allocation
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_PROBE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          uname -a
          echo RUNNER_PROBE_OK

  rnd-studio-python:
    name: R&D Studio Python CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile the R&D Studio sources
        run: python3 -m py_compile tools/kellvyn-rnd-studio/studio.py tools/kellvyn-rnd-studio/test_studio.py

      - name: Test isolated workspace and evidence gates
        run: python3 tools/kellvyn-rnd-studio/test_studio.py

  android-agent-lab:
    name: Unit and Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run JVM unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kellvyn-agent-lab-test-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: ignore
          retention-days: 14
