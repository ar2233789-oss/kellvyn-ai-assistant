name: Kellvyn agent laboratory tests

on:
  workflow_dispatch:
  push:
    branches:
      - lab/kellvyn-intelligence-core-20261116
      - 'kellvyn-rnd/**'
    paths:
      - 'android/app/src/main/java/com/kellvyn/assistant/Kellvyn*.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/neural/**'
      - 'android/app/src/main/java/com/kellvyn/assistant/workspace/**'
      - 'android/app/src/androidTest/**'
      - 'android/app/src/test/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/xml/**'
      - 'android/app/build.gradle'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle.properties'
      - '.github/workflows/agent-lab-tests.yml'
      - 'tools/kellvyn-rnd-studio/**'

permissions:
  contents: read

concurrency:
  group: kellvyn-agent-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-lab-quality-gate:
    name: Python CLI, Gradle unit tests and Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture runner preflight and baseline resources
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/runner-preflight.txt"
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "github_sha=$GITHUB_SHA"
            echo "github_ref=$GITHUB_REF"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "--- uname ---"
            uname -a
            echo "--- cpu ---"
            nproc
            echo "--- memory ---"
            if command -v free >/dev/null 2>&1; then free -h; else cat /proc/meminfo; fi
            echo "--- workspace disk ---"
            df -h "$GITHUB_WORKSPACE"
            echo "--- python ---"
            python3 --version
          } | tee "$REPORT"

      - name: Compile the R&D Studio Python CLI
        run: python3 -m py_compile tools/kellvyn-rnd-studio/studio.py tools/kellvyn-rnd-studio/test_studio.py

      - name: Test isolated workspaces, wrapper integrity and evidence gates
        run: python3 tools/kellvyn-rnd-studio/test_studio.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Record Android toolchain versions
        shell: bash
        run: |
          {
            echo "--- java ---"
            java -version 2>&1
            echo "--- gradle ---"
            gradle --version
            echo "--- adb ---"
            adb version
          } | tee -a runner-preflight.txt

      - name: Run JVM unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Capture final runner resources
        if: always()
        shell: bash
        run: |
          {
            echo "--- final_snapshot_at_utc ---"
            date -u +%Y-%m-%dT%H:%M:%SZ
            echo "--- final_memory ---"
            if command -v free >/dev/null 2>&1; then free -h; else cat /proc/meminfo; fi
            echo "--- final_disk ---"
            df -h "$GITHUB_WORKSPACE"
          } | tee -a runner-preflight.txt

      - name: Preserve preflight, APK and Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kellvyn-agent-lab-evidence
          path: |
            runner-preflight.txt
            android/app/build/reports/tests/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/connected_android_test_additional_output/**
            android/app/build/outputs/apk/debug/**
          if-no-files-found: ignore
          retention-days: 14
