# Super Lab: tooling-only workflow. Never edits product UI or AI runtime.
name: Super Lab — Web, Android virtual, and creative studio

on:
  push:
    branches: ["**"]
    paths:
      - "workshop/**"
      - ".github/workflows/super-lab.yml"
  pull_request:
    paths:
      - "workshop/**"
      - ".github/workflows/super-lab.yml"
  workflow_dispatch:
    inputs:
      run_android:
        description: Boot Android 15 virtual Poco F6 profile and install native APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: super-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope-guard:
    name: Protect the product outside lab tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject product-source changes in this tooling branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 workshop/tools/labctl.py guard --base origin/main --head HEAD

  unit-tests:
    name: Test lab tools and syntax
    needs: scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - name: Compile and run lab unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -m py_compile workshop/tools/labctl.py workshop/tests/test_labctl.py workshop/blender/studio_pipeline.py
          node --check workshop/tools/web_audit.mjs
          bash -n workshop/tools/android_smoke.sh
          python3 -m unittest discover -s workshop/tests -v 2>&1 | tee out/unit-tests.log
          python3 workshop/tools/labctl.py doctor --output out/toolchain.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-lab-tool-tests
          path: out/*
          if-no-files-found: warn
          retention-days: 14

  web-lab:
    name: Inspect the existing web interface
    needs: scope-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run existing web tests and production build
        run: |
          bun run test
          bun run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture and inspect web controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/web
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > out/web/server.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { cat out/web/server.log; exit 1; }
          KELLVYN_LAB_URL=http://127.0.0.1:4173/ LAB_OUTPUT_DIR=out/web node workshop/tools/web_audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-lab-web
          path: out/web/*
          if-no-files-found: warn
          retention-days: 14

  android-virtual-lab:
    name: Build and exercise native APK on Android 15 virtual device
    needs: scope-guard
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and virtual device image
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$MANAGER"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          set +o pipefail; yes | "$MANAGER" --licenses >/dev/null; set -o pipefail
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          AVDMANAGER="$(dirname "$MANAGER")/avdmanager"
          mkdir -p "$HOME/.android/avd"
          echo no | "$AVDMANAGER" create avd --force --name PocoF6Virtual --package "system-images;android-35;google_apis;x86_64" --device pixel_7
          CFG="$HOME/.android/avd/PocoF6Virtual.avd/config.ini"
          set_prop() { if grep -q "^$1=" "$CFG"; then sed -i "s|^$1=.*|$1=$2|" "$CFG"; else echo "$1=$2" >> "$CFG"; fi; }
          set_prop hw.lcd.width 1220
          set_prop hw.lcd.height 2712
          set_prop hw.lcd.density 440
          set_prop hw.ramSize 8192
          set_prop hw.cpu.ncore 4
          set_prop disk.dataPartition.size 4096M
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
      - name: Compile Android unit tests and APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Launch the Android 15 virtual device, install the app, and capture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          "$ANDROID_HOME/emulator/emulator" -avd PocoF6Virtual -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > out/android/emulator.log 2>&1 &
          echo $! > out/android/emulator.pid
          bash workshop/tools/android_smoke.sh android/app/build/outputs/apk/debug/app-debug.apk out/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-lab-android
          path: out/android/*
          if-no-files-found: warn
          retention-days: 14

  creative-studio:
    name: Render 2D, 3D, lighting, palette, and time animation
    needs: scope-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and headless render libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
          blender --version | head -n 2
      - name: Generate editable scenes and preview renders
        shell: bash
        run: |
          set -euo pipefail
          for mode in 2d 3d 4d; do
            mkdir -p "out/studio/$mode"
            blender --background --factory-startup --python workshop/blender/studio_pipeline.py -- --mode "$mode" --palette emerald --output-dir "out/studio/$mode" > "out/studio/$mode/blender.log" 2>&1
            test -s "out/studio/$mode/preview.png"
            test -s "out/studio/$mode/scene.blend"
            test -s "out/studio/$mode/studio-manifest.json"
          done
          test -s out/studio/3d/scene.glb
          test -s out/studio/4d/scene.glb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-lab-studio
          path: out/studio/**
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Package logs, screenshots, and comparison dashboard
    if: always()
    needs: [scope-guard, unit-tests, web-lab, android-virtual-lab, creative-studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: super-lab-*
          path: report/artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Generate report without inventing missing test results
        shell: bash
        env:
          SCOPE_STATUS: ${{ needs.scope-guard.result }}
          TOOLS_STATUS: ${{ needs.unit-tests.result }}
          WEB_STATUS: ${{ needs.web-lab.result }}
          ANDROID_STATUS: ${{ needs.android-virtual-lab.result }}
          STUDIO_STATUS: ${{ needs.creative-studio.result }}
        run: |
          set -euo pipefail
          mkdir -p report/visual
          if test -s report/artifacts/super-lab-web/web-reference.png && test -s report/artifacts/super-lab-web/web-settings.png && test -s report/artifacts/super-lab-android/native-screen.png && test -s report/artifacts/super-lab-android/native-settings.png; then
            python3 -m pip install --disable-pip-version-check pillow numpy
            python3 scripts/compare_poco_f6_captures.py --web-dir report/artifacts/super-lab-web --native-dir report/artifacts/super-lab-android --output-dir report/visual --status-bar-top-px 136
          else
            printf '{"status":"skipped","reason":"Missing one or more actual web/native captures; no parity pass claimed. Inspect attached diagnostics."}\n' > report/visual/comparison-skipped.json
          fi
          python3 workshop/tools/labctl.py report --input-dir report/artifacts --output-dir report --status "scope-guard=$SCOPE_STATUS" --status "tools=$TOOLS_STATUS" --status "web=$WEB_STATUS" --status "android=$ANDROID_STATUS" --status "studio=$STUDIO_STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-lab-report
          path: report/**
          if-no-files-found: warn
          retention-days: 14
