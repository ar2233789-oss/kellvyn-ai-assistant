name: Kellvyn neural core tests

on:
  workflow_dispatch:
  push:
    branches:
      - lab/kellvyn-intelligence-core-20261116
    paths:
      - 'android/app/src/main/java/com/kellvyn/assistant/neural/**'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynAgent.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynRuntime.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynAgentLimits.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynTaskPlanner.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynTaskCheckpointStore.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynMemory.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynContextAssembler.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynProjectContextRetriever.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/workspace/ProjectWorkspaceStore.kt'
      - 'android/app/src/test/java/com/kellvyn/assistant/KellvynProjectContextRetrieverTest.kt'
      - 'android/app/src/main/java/com/kellvyn/assistant/KellvynEncryptedMemoryRepository.kt'
      - 'android/app/src/test/java/com/kellvyn/assistant/KellvynMemoryTest.kt'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/xml/**'
      - 'android/app/src/test/java/com/kellvyn/assistant/**'
      - '.github/workflows/neural-core-tests.yml'
      - 'android/app/build.gradle'
      - 'android/build.gradle'

permissions:
  contents: read

jobs:
  neural-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests only (no APK or release)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace
