name: Oficina Kellvyn — validação e APK nativo

on:
  push:
    branches:
      - main
      - "workshop/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Validar a base visual atual
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências usando o lockfile existente
        run: bun install --frozen-lockfile

      - name: Compilar a base atual
        run: bun run build

      - name: Verificar lint funcional sem bloquear por formatação antiga
        run: bun run lint --rule 'prettier/prettier: off'

      - name: Relatar divergências de formatação existentes (não bloqueante)
        continue-on-error: true
        run: bun run lint

      - name: Executar testes existentes
        run: bun run test --passWithNoTests

  native-android:
    name: Compilar APK Android nativo (quando o módulo existir)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Avisar se o módulo nativo ainda não existe
        if: ${{ hashFiles('android/gradlew') == '' }}
        run: |
          echo "::warning::Este repositório ainda não contém android/gradlew. Nenhum APK nativo foi gerado por este job."

      - name: Preparar Java para Gradle
        if: ${{ hashFiles('android/gradlew') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        if: ${{ hashFiles('android/gradlew') != '' }}
        uses: android-actions/setup-android@v3

      - name: Compilar APK de depuração
        if: ${{ hashFiles('android/gradlew') != '' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publicar APK como artefato baixável
        if: ${{ hashFiles('android/gradlew') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kellvyn-native-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release-apk:
    name: Publicar APK direto em GitHub Releases (somente tags v*)
    runs-on: ubuntu-latest
    needs: native-android
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Exigir módulo Android nativo real
        run: |
          if [ ! -f android/gradlew ]; then
            echo "::error::Release cancelado: não existe android/gradlew. Nenhum APK nativo foi produzido."
            exit 1
          fi

      - name: Baixar o APK compilado nesta execução
        uses: actions/download-artifact@v4
        with:
          name: kellvyn-native-debug-apk
          path: release

      - name: Publicar o APK como arquivo direto do GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
