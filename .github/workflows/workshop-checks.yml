name: Oficina Kellvyn — validação, Android nativo e 3D

on:
  push:
    branches:
      - main
      - "workshop/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Validar a base web sem reformatar a interface
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências usando o lockfile existente
        run: bun install --frozen-lockfile

      - name: Compilar a base web
        run: bun run build

      - name: Verificar lint sem bloquear por formatação antiga
        run: bun run lint --rule 'prettier/prettier: off'

      - name: Relatar problemas de formatação preexistentes
        continue-on-error: true
        run: bun run lint

      - name: Executar testes existentes
        run: bun run test --passWithNoTests

  native-android:
    name: Compilar o módulo Android existente
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Confirmar que há projeto Android
        if: ${{ hashFiles('android/settings.gradle') == '' || hashFiles('android/app/build.gradle') == '' }}
        run: |
          echo "::error::Não foi encontrado android/settings.gradle e android/app/build.gradle; não há projeto Android compilável."
          exit 1

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK e Build Tools exigidos pelo projeto
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar e configurar Gradle sem inventar um wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compilar APK nativo
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK como artefato direto
        uses: actions/upload-artifact@v7
        with:
          name: kellvyn-native-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  blender-toolchain:
    name: Validar criação e exportação de animação 3D
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Criar e exportar cena 3D animada de teste
        run: |
          mkdir -p out
          blender --background --factory-startup --python workshop/blender/smoke_test.py -- --output-dir out

      - name: Guardar GLB e manifesto do teste
        uses: actions/upload-artifact@v7
        with:
          name: kellvyn-3d-animation-smoke
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release-apk:
    name: Publicar APK direto no GitHub Releases (tags v*)
    runs-on: ubuntu-latest
    needs: native-android
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Exigir projeto Android real
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ]; then
            echo "::error::Release cancelado: não há módulo Android compilável."
            exit 1
          fi

      - name: Baixar o APK compilado nesta execução
        uses: actions/download-artifact@v7
        with:
          name: kellvyn-native-debug-apk
          path: release

      - name: Publicar o arquivo APK direto
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
